name: ci

on:
  # Every branch push is verified at its exact HEAD; a PR also verifies the
  # merge result. The repository is public, so these runners stay free.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"
          cache: npm
      - name: Clean install from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax and module integrity
        run: npm run check
      - name: Unit tests
        run: npm run test:unit

  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"
          cache: npm
      - name: Clean install from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: HTTP integration against the WorkflowEngine harness
        run: npm run test:integration

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"
          cache: npm
      - name: Clean install from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package, clean install, entrypoint
        run: npm run verify:package

  contract:
    name: contract and API version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"
          cache: npm
      - name: Clean install from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Workflow policy
        run: npm run verify:workflows
      - name: Contract, version and capability claims
        run: npm run verify:contract

  security:
    name: dependencies and isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"
          cache: npm
      - name: Clean install from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=low
      - name: No local inference, database, daemon, Docker or Ollama
        run: npm run verify:isolation

  release:
    name: release artifact
    needs: [unit, integration, package, contract, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"
          cache: npm
      - name: Clean install from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build reproducible artifact and checksums
        run: npm run release:build -- --out-dir dist
      - name: Verify the checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Install the artifact and run it
        run: npm run verify:package
      - name: Upload the artifact for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coderax-cli-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  gate:
    name: ci gate
    if: always()
    needs: [unit, integration, package, contract, security, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "a required job did not succeed"
          exit 1
