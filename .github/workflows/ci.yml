name: ci

on:
  push:
    branches: [main]
  # Only code changes start the matrix. A plain `pull_request` also fires on
  # edits, labels and bot comments; with cancel-in-progress that killed a
  # running Windows job when a review bot updated the PR body.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  # Hosted standard runners only. This repository is being prepared for private
  # operation, so pull requests run Linux only; the full OS matrix runs on main.
  # That keeps the macOS (10x) and Windows (2x) multipliers off every PR.
  verify:
    name: verify (${{ matrix.os }})
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-verify-${{ matrix.os }}
      cancel-in-progress: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install from the lockfile
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: Unit, CLI and contract tests
        run: npm test
      - name: Build release artifacts
        run: npm run build
      - name: Verify checksums, contents, installers and safety
        run: npm run verify
      # Real packed artifacts: install into a path with spaces and Unicode,
      # refuse argv tokens, authenticate over stdin, exercise every
      # compatibility state, stream Work SSE, upgrade atomically with rollback,
      # and uninstall.
      - name: Hosted installation acceptance (install → auth → upgrade → uninstall)
        run: npm run install-test
      - name: Reproducibility check
        if: runner.os == 'Linux'
        run: npm run repro
      - name: Upload installation evidence
        if: failure() || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-evidence-${{ matrix.os }}
          path: |
            dist/install-evidence.json
            dist/SHA256SUMS
            dist/sbom.spdx.json
            dist/release-manifest.json
          if-no-files-found: ignore
          retention-days: 7

  # The protected branch requires a check context named exactly "test".
  # GitHub accepts a skipped job as passing. Evaluate the result even after
  # verify fails or is cancelled, and keep this gate outside concurrency
  # groups so it cannot block verification for a newer run.
  test:
    name: test
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every platform to pass
        shell: bash
        run: |
          result="${{ needs.verify.result }}"
          echo "verify result: $result"
          if [ "$result" != "success" ]; then
            echo "One or more platform jobs did not pass."
            exit 1
          fi

  dependencies:
    name: dependency audit
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-dependencies
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install from the lockfile
        run: npm ci --ignore-scripts
      - name: Runtime dependencies must remain empty
        shell: bash
        run: |
          node -e '
            const pkg = require("./package.json");
            const deps = Object.keys(pkg.dependencies ?? {});
            if (deps.length > 0) {
              console.error("runtime dependencies are not allowed: " + deps.join(", "));
              process.exit(1);
            }
            console.log("runtime dependencies: 0");
          '
      - name: Audit the dependency tree
        run: npm audit --audit-level=high
      - name: Show the full dependency tree
        run: npm ls --all
