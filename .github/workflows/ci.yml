name: ci

on:
  push:
    branches: [main, feat/workflow-engine-capabilities]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify the vendored canonical SDK
        run: npm run verify:vendor
      - name: Syntax check
        run: npm run check
      - name: Unit, CLI and real HTTP contract tests
        run: npm test
