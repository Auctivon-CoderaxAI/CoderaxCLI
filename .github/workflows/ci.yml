name: ci

on:
  push:
    # PR #5 owns `main`; verify this stacked security branch on every push so
    # the exact stacked SHA has a hosted run even before a PR is opened.
    branches: [main, feat/secure-owner-auth]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The protected branch requires the check context named exactly "test".
  # Keep that aggregator name while running the suite on free standard runners
  # for every supported OS. No larger runners, paid actions or secrets are used.
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"
      - name: Syntax check
        run: npm run check
      - name: Unit, CLI and contract tests
        run: node scripts/run-tests.mjs
      - name: Cross-platform install smoke
        run: node scripts/smoke-install.mjs
      - name: Install Linux Secret Service for real-store verification
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - name: Verify Windows DPAPI credential store
        if: runner.os == 'Windows'
        run: node scripts/verify-credential-store.mjs
      - name: Verify macOS Keychain credential store
        if: runner.os == 'macOS'
        run: node scripts/verify-credential-store.mjs
      - name: Verify Linux libsecret credential store
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- bash -euo pipefail -c '
            export XDG_RUNTIME_DIR=$(mktemp -d)
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            node scripts/verify-credential-store.mjs
          '

  test:
    name: test
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every platform to pass
        shell: bash
        run: |
          result="${{ needs.verify.result }}"
          echo "verify result: $result"
          if [ "$result" != "success" ]; then
            echo "One or more platform jobs did not pass."
            exit 1
          fi
