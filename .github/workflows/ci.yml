name: ci

# One authoritative CI pipeline. Every branch and every pull request runs the
# same suite that the release workflow runs before publishing. No paid runners,
# secrets, or third-party services are used.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"

      - name: Install from the lockfile
        run: npm ci --ignore-scripts

      - name: Syntax check
        run: npm run check

      - name: Unit, CLI, contract and release tests
        run: npm test

      - name: Build release artifacts
        run: npm run build

      - name: Verify checksums, archives and install safety
        run: npm run verify

      - name: Install zsh and fish (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh fish

      - name: Install fish (macOS)
        if: runner.os == 'macOS'
        run: brew install fish

      - name: Native install, completion, auth, streaming, upgrade, rollback and uninstall
        run: npm run install-test

      - name: Reproducible build (Linux)
        if: runner.os == 'Linux'
        run: npm run repro

      - name: Dependency vulnerability scan
        run: npm audit --omit=dev --audit-level=high

      - name: Native install evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: install-evidence-${{ matrix.os }}
          path: dist/install-evidence.json
          if-no-files-found: error
          retention-days: 7

  # The protected branch requires the check context named exactly "test".
  test:
    name: test
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every platform to pass
        shell: bash
        run: |
          result="${{ needs.verify.result }}"
          echo "verify result: $result"
          if [ "$result" != "success" ]; then
            echo "One or more platform jobs did not pass."
            exit 1
          fi
