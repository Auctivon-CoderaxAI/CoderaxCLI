name: ci

on:
  push:
    # Verify branch pushes at their exact commit; PR runs use Linux.
    branches: ["**"]
  workflow_dispatch:
  # Only code changes start the matrix. A plain `pull_request` also fires on
  # edits, labels and bot comments; with cancel-in-progress that killed a
  # running Windows job when a review bot updated the PR body.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Concurrency is per job and does not cancel. A backed-up hosted queue makes a
# newer run share a group with older candidates; cancelling in progress then
# discards the newer run before it can execute. Each job waits its turn, and the
# required `test` gate stays outside every group so it always reports.
jobs:
  # Hosted standard runners only. This repository is being prepared for private
  # operation, so pull requests run Linux only; the full OS matrix runs on main
  # and on an `rc/**` release candidate. That keeps the macOS (10x) and Windows
  # (2x) multipliers off every PR while still requiring cross-platform
  # acceptance at the exact release SHA before a release.
  verify:
    name: verify (${{ matrix.os }})
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-verify-${{ matrix.os }}
      cancel-in-progress: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install from the lockfile
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: Unit, CLI, contract, integration and interactive tests
        shell: bash
        run: |
          set -o pipefail
          # GitHub's bash shell starts with -e; keep the failing test status for
          # the annotation pass instead of exiting at the pipeline.
          set +e
          npm test 2>&1 | tee test-output.log
          test_exit=${PIPESTATUS[0]}
          set -e
          if [ "$test_exit" -ne 0 ]; then
            awk '/✖|not ok|failing tests|AssertionError|Error:|ERR_/ && ++n <= 40 { print NR ":" $0 }' test-output.log | while IFS= read -r line; do
              echo "::error title=test failure::$line"
            done
            tail -60 test-output.log | awk '{ output = output " " $0 } END { print "::error title=test output tail::" substr(output, 1, 4000) }'
          fi
          exit "$test_exit"
      - name: Validate contract and runtime isolation
        run: |
          node scripts/verify-contract.mjs
          node scripts/verify-isolation.mjs
      - name: Build release artifacts
        run: npm run build
      - name: Verify checksums, contents, installers and safety
        run: npm run verify
      # Real packed artifacts: install into a path with spaces and Unicode,
      # refuse argv tokens, authenticate over stdin, exercise every
      # compatibility state, stream Work SSE, upgrade atomically with rollback,
      # and uninstall.
      - name: Hosted installation acceptance (install → auth → upgrade → uninstall)
        run: npm run install-test
      # The acceptance script records every check in dist/install-evidence.json.
      # Publish the failing ones as annotations so an installer failure is
      # diagnosable without admin access to the job log or the artifact.
      - name: Publish install acceptance failures
        if: failure()
        shell: bash
        run: |
          if [ -f dist/install-evidence.json ]; then
            node -e 'const e=require("./dist/install-evidence.json"); for (const c of e.checks||[]) if (!c.ok) console.log("::error::"+c.name+": "+String(c.detail||"").split("\n")[0]);'
          fi
      - name: Reproducibility check
        if: runner.os == 'Linux'
        run: npm run repro
      - name: Upload installation evidence
        if: failure() || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-evidence-${{ matrix.os }}
          path: |
            dist/install-evidence.json
            dist/SHA256SUMS
            dist/sbom.spdx.json
            dist/release-manifest.json
          if-no-files-found: ignore
          retention-days: 7

  # A real pseudo-terminal, not a mocked stream: raw mode, resize, wide
  # characters, multiline editing, markdown streaming, cancellation and clean
  # exit. `script` is available on both hosted POSIX images.
  pty:
    name: real PTY (${{ matrix.os }})
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-pty-${{ matrix.os }}
      cancel-in-progress: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"
          cache: npm
      - name: Install from the lockfile
        run: npm ci --ignore-scripts
      - name: Real pseudo-terminal tests
        run: npm run test:pty

  # The protected branch requires a check context named exactly "test".
  # GitHub accepts a skipped job as passing, so evaluate the result even after
  # verify fails or is cancelled, and keep this gate outside concurrency
  # groups so it cannot block verification for a newer run.
  test:
    name: test
    needs: [verify, pty, pack, install-smoke, engine-integration, contract, dependencies]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all verification jobs to pass
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          node -e 'const results = JSON.parse(process.env.RESULTS);
            console.log(results);
            if (!results.every(result => result === "success")) process.exit(1);'


  dependencies:
    name: dependency audit
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-dependencies
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install from the lockfile
        run: npm ci --ignore-scripts
      - name: Runtime dependencies must remain empty
        shell: bash
        run: |
          node -e '
            const pkg = require("./package.json");
            const deps = Object.keys(pkg.dependencies ?? {});
            if (deps.length > 0) {
              console.error("runtime dependencies are not allowed: " + deps.join(", "));
              process.exit(1);
            }
            console.log("runtime dependencies: 0");
          '
      - name: Audit the dependency tree
        run: npm audit --audit-level=high
      - name: Show the full dependency tree
        run: npm ls --all

  pack:
    name: packed artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked tooling
        run: npm ci
      - name: Verify packed entrypoint and dependency integrity
        run: npm run pack:check
      - name: Build a Linux release archive
        run: npm run release:build -- --platform linux --arch x64

  install-smoke:
    name: installer smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked tooling
        run: npm ci
      - name: Build and install the release archive
        shell: bash
        run: |
          set -eu
          VERSION="$(node -p "require('./package.json').version")"
          npm run release:build -- --platform linux --arch x64
          mkdir -p "$RUNNER_TEMP/release-serve"
          cp "dist/coderax-cli-$VERSION-linux-x64.tar.gz" "$RUNNER_TEMP/release-serve/"
          cp dist/SHA256SUMS-linux-x64 "$RUNNER_TEMP/release-serve/SHA256SUMS"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/release-serve" >/tmp/coderax-http.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          sleep 1
          CODERAX_VERSION="$VERSION" \
          CODERAX_RELEASE_BASE=http://127.0.0.1:8765 \
          CODERAX_HOME="$RUNNER_TEMP/coderax-home" \
          sh install.sh
          "$RUNNER_TEMP/coderax-home/bin/coderax" --version
          "$RUNNER_TEMP/coderax-home/bin/coderax" completion bash | grep -q 'complete -F'

  engine-integration:
    name: real engine harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the pinned WorkflowEngine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Auctivon-CoderaxAI/Coderax-WorkflowEngine
          ref: 7b7c9d7a88b8e483995ebe445f2bbbdd29050229
          path: .engine
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked CLI tooling
        run: npm ci
      - name: Install and build the engine
        working-directory: .engine
        run: npm ci --no-audit --no-fund && npm run build
      - name: Exercise the CLI against the engine harness
        run: WORKFLOW_ENGINE_ROOT="$GITHUB_WORKSPACE/.engine" npm run test:engine

  contract:
    name: engine contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned WorkflowEngine contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Auctivon-CoderaxAI/Coderax-WorkflowEngine
          # Pinned engine revision; update only with a reviewed contract diff.
          ref: 7b7c9d7a88b8e483995ebe445f2bbbdd29050229
          path: engine
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Compare constants, routes and local validators
        run: node scripts/check-contract.mjs engine
