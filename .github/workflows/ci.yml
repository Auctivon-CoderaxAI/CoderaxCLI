name: ci

on:
  push:
    branches: [main]
  # Only code changes start the matrix. A plain `pull_request` also fires on
  # edits, labels and bot comments; with cancel-in-progress that killed a
  # running Windows job when a review bot updated the PR body.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Full cross-platform acceptance once a week, plus at release time in
  # release.yml. Normal PR and main runs are Linux-only so the 2x Windows and
  # 10x macOS multipliers do not consume the private Free allowance.
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    uses: ./.github/workflows/verify.yml
    with:
      os: ${{ matrix.os }}
      ref: ${{ github.sha }}

  # The protected branch requires a check context named exactly "test".
  # Private GitHub Free cannot enforce it; release.yml independently requires
  # this result at the merged pull-request head.
  test:
    name: test
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected platform to pass
        shell: bash
        run: |
          result="${{ needs.verify.result }}"
          echo "verify result: $result"
          if [ "$result" != "success" ]; then
            echo "One or more platform jobs did not pass."
            exit 1
          fi

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install from the lockfile
        run: npm ci --ignore-scripts
      - name: Runtime dependencies must remain empty
        shell: bash
        run: |
          node -e '
            const pkg = require("./package.json");
            const deps = Object.keys(pkg.dependencies ?? {});
            if (deps.length > 0) {
              console.error("runtime dependencies are not allowed: " + deps.join(", "));
              process.exit(1);
            }
            console.log("runtime dependencies: 0");
          '
      - name: Audit the dependency tree
        run: npm audit --audit-level=high
      - name: Show the full dependency tree
        run: npm ls --all
