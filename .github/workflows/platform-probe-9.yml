name: platform-probe-9

# Temporary validation of the Windows and macOS fixes after the last commit.
on:
  push:
    branches: [ci/platform-probe-9]

permissions:
  contents: read

concurrency:
  group: platform-probe-9-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pty-macos:
    name: pty (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - name: Real pseudo-terminal tests
        shell: bash
        run: |
          set +e
          npm run test:pty > .ci-pty.log 2>&1
          code=$?
          tail -40 .ci-pty.log
          node scripts/ci-annotate-detail.mjs .ci-pty.log
          exit $code

  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Unit, CLI, security and contract tests
        shell: bash
        run: |
          set +e
          npm test > .ci-test.log 2>&1
          code=$?
          node scripts/ci-annotate-detail.mjs .ci-test.log
          exit $code
      - run: npm run build
      - run: npm run verify
      - name: Hosted installation acceptance
        shell: bash
        run: |
          set +e
          npm run install-test > .ci-install.log 2>&1
          code=$?
          node scripts/ci-annotate-detail.mjs .ci-install.log
          exit $code
