name: release

# Publishing happens only from a version tag or an explicit manual dispatch.
# Pull requests never reach this workflow, so release credentials and the
# contents: write permission are never exposed to untrusted code.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  authorize:
    name: authorize the exact merged revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out release policy from main and fetch tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Resolve and validate the release revision
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::invalid release tag: $tag"; exit 1 ;;
          esac
          sha="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$sha" != "$(git rev-parse --verify "$GITHUB_SHA^{commit}")" ]; then
            echo "::error::tag $tag no longer points to the triggering commit"
            exit 1
          fi
          version="$(git show "$sha:package.json" | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require an approved pull request and exact-head checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_SHA: ${{ steps.meta.outputs.sha }}
        run: node scripts/release-gate.mjs
      - name: Upload the authorization record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-authorization
          path: release-authorization.json
          retention-days: 30

  certify:
    name: certify (${{ matrix.os }})
    needs: authorize
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: ./.github/workflows/verify.yml
    with:
      os: ${{ matrix.os }}
      ref: ${{ needs.authorize.outputs.sha }}

  release:
    name: build and publish the private GitHub Release
    needs: [authorize, certify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload assets
      id-token: write # Sigstore keyless signing for provenance
    steps:
      - name: Check out the authorized commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install from the lockfile
        run: npm ci --ignore-scripts
      - name: Build release artifacts
        run: npm run build
      - name: Verify artifacts, checksums, and install safety
        run: npm run verify
      # GitHub artifact attestations are public-repository-only on GitHub Free.
      # Keyless Sigstore signing is free for private repositories and produces a
      # portable bundle that ships beside each asset.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign release assets with Sigstore
        run: |
          set -euo pipefail
          for f in dist/*; do
            [ -f "$f" ] || continue
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
      - name: Verify the signed archive
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          cosign verify-blob \
            --bundle "dist/coderax-cli-${VERSION}-standalone.tar.gz.sigstore.json" \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/(tags|heads)/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "dist/coderax-cli-${VERSION}-standalone.tar.gz"
      - name: Download the authorization record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-authorization
          path: release-authorization
      - name: Publish the private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.authorize.outputs.tag }}
          SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; cut a new version instead of reusing a tag"
            exit 1
          fi
          tag_ref="refs/tags/$TAG"
          refs="$(git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$tag_ref" "$tag_ref^{}")"
          remote_sha="$(awk -v ref="$tag_ref" '$2 == ref { direct = $1 } $2 == ref "^{}" { peeled = $1 } END { print (peeled ? peeled : direct) }' <<< "$refs")"
          if [ "$remote_sha" != "$SHA" ]; then
            echo "::error::tag $TAG no longer points to the authorized commit $SHA"
            exit 1
          fi
          gh release create "$TAG" dist/* release-authorization/release-authorization.json \
            --title "Coderax CLI $TAG" \
            --notes-file dist/release-notes.md \
            --verify-tag
