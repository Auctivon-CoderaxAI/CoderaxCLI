name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"
      - name: Verify the tag matches package.json
        shell: bash
        run: |
          node -e 'const p=require("./package.json"); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) { console.error(`tag ${process.env.GITHUB_REF_NAME} does not match v${p.version}`); process.exit(1); }'
      - name: Install locked tooling
        run: npm ci
      - name: Static checks
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build archives
        shell: bash
        run: |
          npm run release:build -- --platform "${{ matrix.platform }}" --arch x64
          npm run release:build -- --platform "${{ matrix.platform }}" --arch arm64
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS-*
            dist/manifest-*.json

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Combine checksums
        shell: bash
        run: |
          cd release-assets
          test -n "$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$(find . -maxdepth 1 -name '*.zip' -print -quit)"
          sha256sum *.tar.gz *.zip | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          TAG="$GITHUB_REF_NAME"
          FILES=(release-assets/*.tar.gz release-assets/*.zip release-assets/SHA256SUMS install.sh install.ps1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --verify-tag --generate-notes
          fi
