name: Secret scan

# Free replacement for GitHub secret scanning and push protection, which are
# only available on private repositories with GitHub Secret Protection (paid).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-commits:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan only the commits introduced by this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD"
          else
            RANGE="${BASE_SHA}..HEAD"
          fi
          echo "Scanning ${RANGE}"
          # Diff against the first parent to catch merge-only additions without
          # replaying base-branch changes against the PR head parent.
          docker run --rm --network=none -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" \
            git /repo --no-banner --redact --exit-code=1 \
            --log-opts="--full-history --diff-merges=first-parent $RANGE"

  full-history:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit full history
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          docker run --rm --network=none -v "$PWD:/repo:ro" \
            -v "$RUNNER_TEMP/gitleaks:/reports" "$GITLEAKS_IMAGE" \
            git /repo --no-banner --redact --exit-code=1 \
            --log-opts="--full-history --all --diff-merges=separate" \
            --report-format json --report-path=/reports/gitleaks.json
      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks/gitleaks.json
          if-no-files-found: ignore
          retention-days: 7
