[extend]
useDefault = true

[[allowlists]]
description = "Public SHA-256 of the pinned WorkflowEngine OpenAPI artifact"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^(src/contract\.js|packages/workflow-sdk/src/v1/contract\.js)$''']
regexes = ['''^66add22a0d38405e9aaa49a62a9e463648df00457ce0b0080e3cca240c9736f4$''']

[[allowlists]]
description = "Synthetic token literal used by the sensitive prompt test"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^test/terminal-history\.test\.js$''']
regexes = ['''^1234567890abcdef1234567890abcdef$''']
